<aside class="sidebar">
  <div class="sidebar-header">
    <h2 class="sidebar-title">The Human Ledger</h2>
  </div>

  <nav class="sidebar-nav">
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
      <mat-icon>home</mat-icon>
      <span>Home</span>
    </a>
    <a routerLink="/analytics" routerLinkActive="active" class="nav-link">
      <mat-icon>trending_up</mat-icon>
      <span>Analytics</span>
    </a>
    <a routerLink="/transactions" routerLinkActive="active" class="nav-link">
      <mat-icon>history</mat-icon>
      <span>Transactions</span>
    </a>
    <a routerLink="/summary" routerLinkActive="active" class="nav-link">
      <mat-icon>flag</mat-icon>
      <span>Summary</span>
    </a>
    <a routerLink="/setup" routerLinkActive="active" class="nav-link">
      <mat-icon>settings</mat-icon>
      <span>Profile Setup</span>
    </a>
  </nav>

  <div class="sidebar-footer" *ngIf="profile">
    <div class="user-profile">
      <div class="user-avatar">
      {{ profile.name?.charAt(0)?.toUpperCase() || '?' }}
      </div>
      <div class="user-info">
      <span class="greeting">{{ profile.name || 'User' }}</span>
      <span class="status">Your Ledger is healthy</span>
      </div>
    </div>
  </div>
</aside>

<div class="main-wrapper">
  <header class="top-bar">
    <div class="header-container">
      <h1 class="logo">FinanceFlow</h1>
      <div class="header-actions">
        <button mat-flat-button color="primary" class="add-spend-btn" routerLink="/add-expense">
          <mat-icon>add</mat-icon>
          Add a Spend
        </button>
      </div>
    </div>
  </header>

  <main class="content-area">
    <router-outlet />
  </main>
</div>

<!-- Custom Toast (managed via a simple signal or variable in real apps, but here we just show the structure) -->
<div class="custom-toast" *ngIf="showToast">
  <span>Spend Added successfully!</span>
  <button (click)="showToast = false">Undo</button>
</div>
