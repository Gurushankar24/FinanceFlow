<div class="setup-container">
  <mat-card class="setup-card">
    <mat-card-header>
      <mat-card-title>Welcome to FinanceFlow</mat-card-title>
      <mat-card-subtitle>Let's set up your monthly profile</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="setupForm" (ngSubmit)="onSubmit()" class="setup-form" *ngIf="setupForm">
        <!-- Monthly Salary -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Monthly Salary</mat-label>
          <input matInput type="number" formControlName="salary" placeholder="e.g. 50000" min="1" />
          <mat-error *ngIf="setupForm.get('salary')?.hasError('required')">Salary is required</mat-error>
          <mat-error *ngIf="setupForm.get('salary')?.hasError('min')">Salary must be greater than 0</mat-error>
        </mat-form-field>

        <h3>Monthly Budgets per Category</h3>
        <div formGroupName="budgets" class="budget-grid">
          <mat-form-field *ngFor="let cat of categories" appearance="outline">
            <mat-label>{{ cat.icon }} {{ cat.name }} Budget</mat-label>
            <input matInput type="number" [formControlName]="cat.name" placeholder="e.g. 1000" min="0" />
            <mat-error *ngIf="setupForm.get('budgets.' + cat.name)?.hasError('required')">
              Budget is required
            </mat-error>
          </mat-form-field>
        </div>

        <button mat-raised-button color="primary" type="submit" [disabled]="setupForm.invalid" class="submit-btn">
          Save and Go to Dashboard
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
