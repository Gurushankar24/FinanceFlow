<div class="add-expense-container">
  <div class="form-card">
    <header class="form-header">
      <h2 class="form-title">Add a Spend</h2>
      <p class="form-subtitle">Record your transaction to keep your ledger healthy</p>
    </header>

    <form [formGroup]="expenseForm" (ngSubmit)="onSubmit()" class="expense-form">
      <div class="form-row">
        <!-- Category Dropdown -->
        <div class="form-field full-width">
          <label class="field-label">Category</label>
          <div class="custom-select-wrapper">
            <mat-select formControlName="category" placeholder="Select a category" class="custom-select-field">
              <mat-option *ngFor="let cat of categories" [value]="cat.name">
                {{ cat.icon }} {{ cat.name }}
              </mat-option>
            </mat-select>
          </div>
          <span class="field-error" *ngIf="expenseForm.get('category')?.touched && expenseForm.get('category')?.hasError('required')">
            Category is required
          </span>
        </div>
      </div>

      <div class="form-row">
        <!-- Amount -->
        <div class="form-field full-width">
          <label class="field-label">Amount</label>
          <div class="input-with-prefix">
            <span class="prefix">₹</span>
            <input matInput type="number" formControlName="amount" placeholder="0.00" class="custom-input" />
          </div>
          <span class="field-error" *ngIf="expenseForm.get('amount')?.touched && expenseForm.get('amount')?.hasError('required')">
            Amount is required
          </span>
          <span class="field-error" *ngIf="expenseForm.get('amount')?.touched && expenseForm.get('amount')?.hasError('min')">
            Amount must be at least 1
          </span>
        </div>
      </div>

      <div class="form-row">
        <!-- Date Picker -->
        <div class="form-field full-width">
          <label class="field-label">Date</label>
          <div class="datepicker-wrapper">
            <input matInput [matDatepicker]="picker" formControlName="date" readonly class="custom-input" />
            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </div>
          <span class="field-error" *ngIf="expenseForm.get('date')?.touched && expenseForm.get('date')?.hasError('required')">
            Date is required
          </span>
        </div>
      </div>

      <div class="form-row">
        <!-- Note -->
        <div class="form-field full-width">
          <label class="field-label">Note (Optional)</label>
          <textarea matInput formControlName="note" placeholder="What was this for?" rows="3" class="custom-textarea"></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button mat-flat-button color="primary" type="submit" [disabled]="expenseForm.invalid" class="submit-btn">
          Add Expense
        </button>
      </div>
    </form>
  </div>
</div>
