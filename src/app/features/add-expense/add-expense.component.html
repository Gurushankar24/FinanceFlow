<div class="add-expense-container">
  <mat-card class="add-expense-card">
    <mat-card-header>
      <mat-card-title>Add New Expense</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="expenseForm" (ngSubmit)="onSubmit()" class="expense-form">
        <!-- Category Dropdown -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Category</mat-label>
          <mat-select formControlName="category">
            <mat-option *ngFor="let cat of categories" [value]="cat.name">
              {{ cat.icon }} {{ cat.name }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="expenseForm.get('category')?.hasError('required')">
            Category is required
          </mat-error>
        </mat-form-field>

        <!-- Amount -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Amount</mat-label>
          <input matInput type="number" formControlName="amount" placeholder="e.g. 500" />
          <span matPrefix>₹&nbsp;</span>
          <mat-error *ngIf="expenseForm.get('amount')?.hasError('required')">
            Amount is required
          </mat-error>
          <mat-error *ngIf="expenseForm.get('amount')?.hasError('min')">
            Amount must be at least 1
          </mat-error>
        </mat-form-field>

        <!-- Date Picker -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Date</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="date" readonly />
          <mat-hint>MM/DD/YYYY</mat-hint>
          <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
          <mat-error *ngIf="expenseForm.get('date')?.hasError('required')">
            Date is required
          </mat-error>
        </mat-form-field>

        <!-- Note -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Note (Optional)</mat-label>
          <textarea matInput formControlName="note" placeholder="e.g. Lunch at Cafe" rows="3"></textarea>
        </mat-form-field>

        <div class="form-actions">
          <button mat-raised-button color="primary" type="submit" [disabled]="expenseForm.invalid">
            Add Expense
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
